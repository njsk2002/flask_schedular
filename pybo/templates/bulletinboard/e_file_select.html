{% extends 'e_base.html' %}

{% block content %}
<div class="container-fluid py-3">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h3 class="mb-0">E-Ink 전송 대시보드 (3×2)</h3>
    <div class="d-flex gap-2">
      <button id="btn-save-layouts" class="btn btn-outline-secondary">레이아웃 저장</button>
      <button id="btn-send-all" class="btn btn-primary">전체 전송</button>
    </div>
  </div>

  <!-- 상태 알림 -->
  <div id="toast-area" class="position-fixed top-0 end-0 p-3" style="z-index:1080;"></div>

  <!-- 프리뷰/버튼/오버레이 CSS -->
  <style>
    .btn-nav-sm { padding:.15rem .35rem; font-size:.75rem; line-height:1; }
    .preview-surface {
      height: clamp(300px, 40vh, 520px);
      width: auto; max-width:100%; margin-inline:auto;
      background:#f8f9fa; overflow:hidden; border-radius:.375rem; position:relative;
    }
    .preview-img { width:100%; height:100%; object-fit:contain; transition: transform .15s ease-out; }

    /* 카드 오버레이(표시용, 편집은 모달에서만) */
    .overlay-layers, .modal-overlay { position:absolute; inset:0; }
    .overlay-stage { position:absolute; }

    .layer-item {
      position:absolute; border:1px dashed #0d6efd; background:rgba(13,110,253,.05);
      user-select:none;
    }
    .layer-item .title { position:absolute; top:-18px; left:0; font-size:12px; color:#0d6efd; }
    .slot-rect { position:absolute; border:1px solid rgba(13,110,253,.6); background:rgba(13,110,253,.04); }
    .slot-label {
      position:absolute; left:4px; top:4px; font-size:12px; line-height:1;
      color:#0d6efd; background:rgba(255,255,255,.7); padding:2px 4px; border-radius:3px;
    }
    .slot-baseline { position:absolute; left:0; height:1px; background:#0d6efd; }
    .layer-stamp img, .layer-valid img { display:block; width:100%; height:100%; object-fit:contain; }

    /* ===== 모달 전용 ===== */
    .modal-preview-wrap {
      width:100%; max-height:80vh; background:#f8f9fa; border-radius:.375rem; overflow:hidden;
      position:relative; display:flex; align-items:center; justify-content:center;
    }
    .modal-preview-img { width:100%; height:100%; object-fit:contain; }
    .modal-overlay { position:absolute; inset:0; }
    .modal-edit-active .modal-overlay { pointer-events:auto; }
    .modal-layer { position:absolute; border:1px dashed #198754; background:rgba(25,135,84,.06); cursor:move; }
    .modal-layer .handle { position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:#198754; cursor:se-resize; border-radius:2px; }
    .modal-layer .title { position:absolute; top:-18px; left:0; font-size:12px; color:#198754; }
    .modal-slot { position:absolute; border:1px solid rgba(25,135,84,.6); background:rgba(25,135,84,.05); }
    .modal-slot-label {
      position:absolute; left:6px; top:6px; font-size:14px; line-height:1;
      color:#14532d; background:rgba(255,255,255,.8); padding:2px 6px; border-radius:3px; font-weight:600;
    }
    .modal-slot-baseline { position:absolute; left:0; height:2px; background:#198754; }
    .modal-layer-stamp img, .modal-layer-valid img { display:block; width:100%; height:100%; object-fit:contain; }
  </style>

  <!-- 3×2 그리드 -->
  <div id="tiles" class="row row-cols-1 row-cols-md-3 g-3">
    {% for i in range(1,7) %}
    {% set num = "%02d" % i %}
    <div class="col">
      <div class="card shadow-sm h-100" data-device-no="{{ num }}" data-device-id="E{{ num }}">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>E-INK/{{ num }}</strong>
          <span class="badge text-bg-secondary">E{{ num }}</span>
        </div>

        <div class="card-body d-flex flex-column gap-2">
          <!-- 1ROW -->
          <div class="d-flex flex-column gap-2">
            <div class="d-flex align-items-center gap-2">
              <div class="flex-grow-1 text-truncate">
                <span class="fw-semibold">파일명:</span>
                <span class="file-name" title="파일명">-</span>
              </div>
              <input type="file" class="d-none file-input"
                     accept=".pdf,.png,.jpg,.jpeg,.bmp,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.csv,.txt"/>
              <button class="btn btn-sm btn-outline-primary btn-choose">선택</button>
            </div>
            <input type="text" class="form-control form-control-sm memo-input" placeholder="메모 입력(옵션)">
          </div>

          <!-- 2ROW -->
          <div class="row g-2">
            <div class="col-4">
              <label class="form-label mb-1 small">해상도</label>
              <select class="form-select form-select-sm select-resolution">
                <option value="480x800" >480×800</option>
                <option value="1200x1600" selected>1200×1600</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label mb-1 small">화면선택</label>
              <select class="form-select form-select-sm select-scale">
                <option value="fit" selected>FIT</option>
                <option value="fill">FILL</option>
                <option value="percent">PERCENT</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label mb-1 small">컬러</label>
              <select class="form-select form-select-sm select-mode">
                <option value="BWRYBG" selected>COLOR6 (BWRYBG)</option>
                <option value="BW">MONO (BW)</option>
                <option value="BWRY">COLOR (BWRY)</option>
              </select>
            </div>
            <div class="col-12 percent-row d-none">
              <label class="form-label mb-1 small">배율(%)</label>
              <input type="range" class="form-range percent-input" min="50" max="200" step="1" value="100">
            </div>
          </div>

          <!-- 결재 옵션 (signbox 있을 때만 표시) -->
          <div class="approval-panel border rounded p-2 bg-light-subtle d-flex flex-column gap-2 d-none">
            <div class="d-flex align-items-center gap-3 flex-wrap">
              <div class="form-check form-switch">
                <input class="form-check-input ck-need-approval" type="checkbox">
                <label class="form-check-label small">결재 필요</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input ck-auto-author-sign" type="checkbox" checked>
                <label class="form-check-label small">작성자 자동 서명</label>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input ck-final-approval" type="checkbox">
                <label class="form-check-label small">전결(결재 없이 즉시 업로드)</label>
              </div>
            </div>

            <div class="row g-2 align-items-end">
              <div class="col-sm-6">
                <label class="form-label mb-1 small">결재선</label>
                <select class="form-select form-select-sm sel-route" title="결재선 목록을 주입하지 않으면 비활성화됩니다." disabled>
                  <option value="">(선택하세요)</option>
                </select>
              </div>

              <!-- 부서/사용자 선택 -->
              <div class="col-sm-6">
                <label class="form-label mb-1 small">부서</label>
                <select class="form-select form-select-sm sel-department" disabled>
                  <option value="">(부서 선택)</option>
                </select>
              </div>

              <div class="col-sm-6">
                <label class="form-label mb-1 small">검토자</label>
                <select class="form-select form-select-sm sel-review-user" disabled>
                  <option value="">(검토자 선택)</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label class="form-label mb-1 small">승인자</label>
                <select class="form-select form-select-sm sel-approve-user" disabled>
                  <option value="">(승인자 선택)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3ROW: 프리뷰 + 오버레이(표시만) -->
          <div class="preview-wrap flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="preview-surface border" style="aspect-ratio: 3 / 5;">
              <img class="preview-img" src="" alt="미리보기">
              <div class="overlay-layers position-absolute top-0 start-0 w-100 h-100">
                <div class="overlay-stage"></div>
              </div>
            </div>
          </div>

          <!-- 4ROW: 네비/옵션/파일 수정 -->
          <div class="d-flex align-items-center justify-content-between">
            <div class="btn-group" role="group">
              <button class="btn btn-outline-secondary btn-nav-sm btn-prev" type="button">이전</button>
              <span class="px-2 small page-indicator">- / -</span>
              <button class="btn btn-outline-secondary btn-nav-sm btn-next" type="button">이후</button>
            </div>

            <div class="d-flex gap-2 align-items-center">
              <div class="d-flex align-items-center gap-1">
                <label class="form-label mb-0 small">회전</label>
                <select class="form-select form-select-sm select-rotate" style="width:auto;">
                  <option value="0" selected>0°</option>
                  <option value="90">90°</option>
                  <option value="180">180°</option>
                  <option value="270">270°</option>
                </select>
              </div>

              <!-- 원본/BMP 토글 -->
              <button class="btn btn-outline-dark btn-original" type="button" title="BMP 보기 토글">BMP</button>

              <!-- 파일 수정(모달) -->
              <button class="btn btn-outline-primary btn-enlarge" type="button">파일 수정</button>

              <button class="btn btn-success btn-send" type="button">전송</button>
            </div>
          </div>

        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<!-- ===== 파일 수정 모달 ===== -->
<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">파일 수정 / 선택 해상도 편집</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <div class="modal-preview-wrap" id="modalPreviewWrap">
          <img id="modalPreviewImg" class="modal-preview-img" alt="미리보기(선택 해상도)">
          <div id="modalOverlay" class="modal-overlay">
            <div class="overlay-stage" id="modalOverlayStage"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <div class="btn-group" role="group">
          <button class="btn btn-outline-secondary btn-nav-sm" id="modalPrev">이전</button>
          <span class="px-2 small" id="modalPage">- / -</span>
          <button class="btn btn-outline-secondary btn-nav-sm" id="modalNext">이후</button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small">회전</label>
          <select class="form-select form-select-sm" id="modalRotate" style="width:auto;">
            <option value="0">0°</option>
            <option value="90">90°</option>
            <option value="180">180°</option>
            <option value="270">270°</option>
          </select>

          <!-- 편집 버튼(모달 전용) -->
          <button class="btn btn-outline-secondary" id="modalEditSignbox">결재란</button>
          <button class="btn btn-outline-secondary" id="modalEditStamp">직인</button>
          <button class="btn btn-outline-secondary" id="modalEditValid">유효기간</button>

          <!-- 레이어 이미지 업로드(모달 전용) -->
          <input type="file" id="modalLayerFile" class="d-none" accept=".png,.jpg,.jpeg"/>

          <button class="btn btn-outline-secondary" id="modalRefresh">새로고침</button>
          <button class="btn btn-primary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<!-- 서버에서 주입 -->
<script type="application/json" id="devices-json">
  {{ devices|default([], true)|tojson }}
</script>
<script type="application/json" id="me-json">
  {{ current_user|default({}, true)|tojson }}
</script>
<script type="application/json" id="routes-json">
  {{ approval_routes|default([], true)|tojson }}
</script>

<script>
(() => {
  /* ---------- 공통 유틸 ---------- */
  const toJSON = (id) => {
    try {
      const t = document.getElementById(id);
      return t && t.textContent.trim() ? JSON.parse(t.textContent) : null;
    } catch (e) { return null; }
  };
  const injectedDevices = toJSON('devices-json') || [];
  const injectedMe = toJSON('me-json') || {};
  let injectedRoutes = toJSON('routes-json') || [];

  function toast(msg, type='info'){
    const id = 't'+Date.now()+Math.random().toString(16).slice(2);
    const el = document.createElement('div');
    el.id=id;
    el.className = `toast align-items-center text-bg-${type} border-0 show`;
    el.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button></div>`;
    (document.querySelector('#toast-area')||document.body).appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }

  const parseResolution = v => { const [w,h]=v.split('x').map(Number); return {width:w, height:h}; };
  const getPreviewBoxDims = (selW,selH)=>{
    if (selW===800 && selH===480) return {pw:3, ph:5};
    if (selW===1200 && selH===1600) return {pw:3, ph:4};
    return {pw:selW, ph:selH};
  };
  function applyPreviewAspect(card, s){
    const surface = card.querySelector('.preview-surface');
    if(!surface) return;
    const {pw,ph}=getPreviewBoxDims(s.uiWidth, s.uiHeight);
    surface.style.aspectRatio = `${pw} / ${ph}`;
  }

  /* ---------- 파일 타입 유틸 ---------- */
  function getFileExt(name){
    const idx = name.lastIndexOf('.');
    return idx === -1 ? '' : name.substring(idx+1).toLowerCase();
  }
  function isImageExt(ext){
    return ['png','jpg','jpeg','bmp'].includes(ext);
  }
  function isPdfExt(ext){
    return ext === 'pdf';
  }
  function isOfficeExt(ext){
    return ['ppt','pptx','doc','docx','xls','xlsx','csv','txt'].includes(ext);
  }

  /* ---------- Dept / Users 캐시 ---------- */
  let _departmentsCache = null;
  const _usersByDept = new Map();

  async function fetchDepartments(){
    if (_departmentsCache) return _departmentsCache;
    try {
      const r = await fetch('/bulletin/departments');
      if (!r.ok) throw new Error('dept http');
      const js = await r.json();
      _departmentsCache = Array.isArray(js.departments) ? js.departments : [];
    } catch(e) {
      _departmentsCache = [];
    }
    return _departmentsCache;
  }

  async function fetchUsersByDepartment(dept){
    if (_usersByDept.has(dept||'')) return _usersByDept.get(dept||'');
    try {
      const q = new URLSearchParams(); if (dept) q.set('department', dept);
      const r = await fetch('/bulletin/users?'+q.toString());
      if (!r.ok) throw new Error('users http');
      const js = await r.json();
      const arr = Array.isArray(js.users) ? js.users : [];
      _usersByDept.set(dept||'', arr);
      return arr;
    } catch(e) {
      _usersByDept.set(dept||'', []);
      return [];
    }
  }

  /* ---------- 프리뷰 / 업로드 유틸 ---------- */

  async function showLocalPreviewImage(file, state, imgEl){
    if (!file) return;
    if (state._localUrl) URL.revokeObjectURL(state._localUrl);
    const url = URL.createObjectURL(file);
    state._localUrl = url;
    imgEl.src = url + '#t=' + Date.now();
  }

  // 원본 업로드: 엑셀/워드/PPT/PDF 등 → 서버에서 normalized.pdf + 첫 페이지 이미지 생성
  async function uploadOriginalIfNeeded(state){
    if (state.upload_id || !state._localFile) return;
    const fd = new FormData();
    fd.append('file', state._localFile);
    if (state.device_id) fd.append('device_id', state.device_id);

    const r = await fetch('/bulletin/document/upload_original', {
      method: 'POST',
      body: fd
    });
    if (!r.ok) throw new Error('upload_original failed');

    const js = await r.json();
    state.upload_id = js.upload_id || js.tmp_id || null;
    state.pages = js.page_count || 1;
    state.page = 1;
    if (js.preview_image_url){
      state._originalServerUrl = js.preview_image_url;
    }
    if (!state.file_name && js.filename){
      state.file_name = js.filename;
    }
  }

  // BMP/E-INK 프리뷰: 항상 layout_snapshot + render_params만 사용
  async function bmpPreviewJSON(state, imgEl){
    if (!state.upload_id){
      await uploadOriginalIfNeeded(state);
      if (!state.upload_id){
        throw new Error('no upload_id for bmp_preview');
      }
    }
    const body = {
      upload_id: state.upload_id,
      page: state.page || 1,
      width: state.uiWidth,
      height: state.uiHeight,
      mode: state.mode,
      scale: state.scale,
      percent: state.percent,
      rotate: state.rotate,
      layout_snapshot: buildLayoutSnapshot(state)
    };

    const r = await fetch('/bulletin/bmp_preview', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('bmp_preview failed');

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    if (state._bmpUrl) URL.revokeObjectURL(state._bmpUrl);
    state._bmpUrl = url;
    imgEl.src = url + '#t=' + Date.now();
  }

  /* ---------- 좌표/슬롯 도우미 ---------- */
  const BASE_W = 1200, BASE_H = 1600; // 내부 저장 좌표계(절대)

  function buildFiveSlotsTemplate(){
    return {
      label_ratio: 0.01,
      gap_ratio: 0.01,
      left3_ratio: [0.33, 0.33, 0.33],
      right2_ratio: [],
      vpad_ratio: 0.06,
      outer_hpad_ratio: 0.004,
      line_pos_ratio: 0.72,
      line_hpad_ratio: 0.08,
      line_thickness_px: 2,
      font_size_px: 28,
      font_color: '#14312d',
      line_color: '#198754',
      border_color: '#198754'
    };
  }

  function makeSlotsFromTemplate(parent, tpl){
    const {x,y,w,h} = parent;
    const lr = tpl.label_ratio, gap = tpl.gap_ratio, vp = tpl.vpad_ratio;
    const top = y + h*vp;
    const usableH = h*(1 - 2*vp);

    const left3 = tpl.left3_ratio || [];
    const right2 = Array.isArray(tpl.right2_ratio) ? tpl.right2_ratio : [];

    if (!right2.length) {
      const usableW = w*(1 - lr - 3*gap);
      const x0 = x + w*lr;
      const x1 = x0 + usableW*left3[0] + w*gap;
      const x2 = x1 + usableW*left3[1] + w*gap;

      const slotsPx = [
        {x:x0, y:top, w:usableW*left3[0], h:usableH, role:'author',  label:'작성'},
        {x:x1, y:top, w:usableW*left3[1], h:usableH, role:'review',  label:'검토'},
        {x:x2, y:top, w:usableW*left3[2], h:usableH, role:'approve', label:'승인'},
      ];
      return slotsPx.map(r=>({ role:r.role, label:r.label, x_rel:(r.x-x)/w, y_rel:(r.y-y)/h, w_rel:r.w/w, h_rel:r.h/h }));
    }

    const usableW = w*(1 - 2*lr - 5*gap);
    const x0 = x + w*lr;
    const x1 = x0 + usableW*left3[0] + w*gap;
    const x2 = x1 + usableW*left3[1] + w*gap;
    const xLabel2 = x + w - (w*lr) - (usableW*(right2[0]+right2[1]) + w*gap);
    const x3 = xLabel2 + w*lr + w*gap;
    const x4 = x3 + usableW*right2[0] + w*gap;

    const slots5 = [
      {x:x0, y:top, w:usableW*left3[0],  h:usableH, role:'author',   label:'작성'},
      {x:x1, y:top, w:usableW*left3[1],  h:usableH, role:'review',   label:'검토'},
      {x:x2, y:top, w:usableW*left3[2],  h:usableH, role:'approve',  label:'승인'},
      {x:x3, y:top, w:usableW*right2[0], h:usableH, role:'review2',  label:'검토'},
      {x:x4, y:top, w:usableW*right2[1], h:usableH, role:'approve2', label:'승인'},
    ];
    return slots5.map(r=>({ role:r.role, label:r.label, x_rel:(r.x-x)/w, y_rel:(r.y-y)/h, w_rel:r.w/w, h_rel:r.h/h }));
  }

  function createSignboxLayerDefault(){
    const parent = {
      x:Math.round(BASE_W*0.05),
      y:Math.round(BASE_H*0.72),
      w:Math.round(BASE_W*0.90),
      h:Math.round(BASE_H*0.18)
    };
    const tpl = buildFiveSlotsTemplate();
    const slots = makeSlotsFromTemplate(parent, tpl);
    return { id:'signbox-1', type:'signbox', parent, tpl, slots, z:2 };
  }

  /* ---------- 결재/서명 유틸 ---------- */
  function fillRouteOptions(selectEl, routes){
    const cur = selectEl.value;
    selectEl.innerHTML = `<option value="">(선택하세요)</option>`;
    (routes||[]).forEach(rt=>{
      const opt = document.createElement('option');
      opt.value = rt.id;
      opt.textContent = rt.name || `Route #${rt.id}`;
      selectEl.appendChild(opt);
    });
    selectEl.disabled = !(routes && routes.length);
    selectEl.title = selectEl.disabled ? '결재선 목록이 주입되지 않았습니다.' : '';
    if (cur) selectEl.value = cur;
  }

  function applyRouteDefaultAssignees(routeId, $selReviewUser, $selApproveUser){
    const rt = (injectedRoutes||[]).find(r=> String(r.id)===String(routeId));
    if (!rt) return;
    const rev = (rt.steps||[]).find(s=> s.role==='review');
    const app = (rt.steps||[]).find(s=> s.role==='approve');
    const reviewUserId  = rev?.assignee_userid || '';
    const approveUserId = app?.assignee_userid || '';
    if (reviewUserId) {

    }

  function ensureAuthorSignLayer(state){
    if (!state || !Array.isArray(state.layers)) return;
    const meId = injectedMe?.no;
    if (!meId) return;

    const signbox = state.layers.find(L=> L.type==='signbox' && Array.isArray(L.slots));
    if (!signbox) return;
    const authorSlot = signbox.slots.find(s=> s.role==='author');
    if (!authorSlot) return;

    const px = signbox.parent.x + Math.round(authorSlot.x_rel * signbox.parent.w);
    const py = signbox.parent.y + Math.round(authorSlot.y_rel * signbox.parent.h);
    const pw = Math.round(authorSlot.w_rel * signbox.parent.w);
    const ph = Math.round(authorSlot.h_rel * signbox.parent.h);

    let L = state.layers.find(l => l.type==='sign' && l.role==='author');
    if (!L){
      L = { id:'sign-author', type:'sign', role:'author', user_id: meId, x:px, y:py, w:pw, h:ph, z:3 };
      state.layers.push(L);
    }else{
      L.x = px; L.y = py; L.w = pw; L.h = ph; L.user_id = meId; L.role='author';
    }
  }

  function makeDragResize(el, container, onCommit){
    let mode=null, sx=0, sy=0, sl=0, st=0, sw=0, sh=0;
    el.addEventListener('pointerdown', e=>{
      const rect=el.getBoundingClientRect(), orect=container.getBoundingClientRect();
      const onHandle = e.target.closest('.handle'); mode=onHandle?'resize':'move';
      sx=e.clientX; sy=e.clientY; sl=rect.left-orect.left; st=rect.top-orect.top; sw=rect.width; sh=rect.height;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e=>{
      if(!mode) return; const dx=e.clientX-sx, dy=e.clientY-sy;
      if(mode==='move'){ el.style.left=`${sl+dx}px`; el.style.top=`${st+dy}px`; }
      else{ el.style.width=`${Math.max(40, sw+dx)}px`; el.style.height=`${Math.max(40, sh+dy)}px`; }
    });
    el.addEventListener('pointerup', ()=>{
      const orect=container.getBoundingClientRect();
      const nx=parseFloat(el.style.left)||0, ny=parseFloat(el.style.top)||0;
      const nw=parseFloat(el.style.width)||0, nh=parseFloat(el.style.height)||0;
      mode=null; onCommit(nx,ny,nw,nh, orect);
    });
  }

  function computeImageViewport(containerEl, imgTargetW, imgTargetH){
    const r = containerEl.getBoundingClientRect();
    const cw = r.width, ch = r.height;
    const scale = Math.min(cw / imgTargetW, ch / imgTargetH);
    const vw = imgTargetW * scale;
    const vh = imgTargetH * scale;
    const left = (cw - vw) / 2;
    const top  = (ch - vh) / 2;
    return { left, top, width: vw, height: vh, scaleX: vw / imgTargetW, scaleY: vh / imgTargetH };
  }

  function renderLayersModal(){

    stage.style.left = `${vp.left}px`;

        el.style.left=`${left}px`; el.style.top=`${top}px`; el.style.width=`${wid}px`; el.style.height=`${hei}px`;

        const tpl = L.tpl || buildFiveSlotsTemplate();
        const baselineY = (tpl.line_pos_ratio ?? 0.72);
        const hpad = (tpl.line_hpad_ratio ?? 0.08);
        const thick = Math.max(1, Math.round((tpl.line_thickness_px ?? 2) * Math.min(kx,ky)));

        (L.slots||[]).forEach(S=>{
          const sdiv=document.createElement('div'); sdiv.className='modal-slot';
          const sx = Math.round(S.x_rel*wid), sy=Math.round(S.y_rel*hei);
          const sw = Math.round(S.w_rel*wid), sh = Math.round(S.h_rel*hei);
          sdiv.style.left=`${sx}px`; sdiv.style.top=`${sy}px`;
          sdiv.style.width=`${sw}px`; sdiv.style.height=`${sh}px`;
          if (tpl.border_color) sdiv.style.borderColor = tpl.border_color;

          const lab=document.createElement('div');
          lab.className='modal-slot-label';
          lab.textContent = S.label || S.role || '';
          if (tpl.font_color) lab.style.color = tpl.font_color;
          sdiv.appendChild(lab);

          const line=document.createElement('div');
          line.className='modal-slot-baseline';
          const lineY = Math.round(sh * baselineY);
          const lineLeft = Math.round(sw * hpad);
          const lineRight= Math.round(sw * (1 - hpad));
          line.style.top = `${lineY}px`;
          line.style.left = `${lineLeft}px`;
          line.style.width= `${Math.max(0, lineRight - lineLeft)}px`;
          line.style.height= `${thick}px`;
          if (tpl.line_color) line.style.background = tpl.line_color;
          sdiv.appendChild(line);

          el.appendChild(sdiv);
        });

        makeDragResize(el, stage, (nx,ny,nw,nh, orect)=>{
          const kx0 = orect.width/BASE_W, ky0 = orect.height/BASE_H;
          L.parent={
            x:Math.round(nx/kx0),
            y:Math.round(ny/ky0),
            w:Math.round(nw/kx0),
            h:Math.round(nh/ky0)
          };
          L.slots = makeSlotsFromTemplate(L.parent, L.tpl);
          ensureAuthorSignLayer(modalState);
          renderLayersModal();
          modalCurrentCard?._renderLayers?.();
          modalCurrentCard?._onStateChanged?.();
          refreshModalPreview();

      if(L.type==='stamp' || L.type==='validity'){
        const el=document.createElement('div');
        el.className='modal-layer '+(L.type==='stamp'?'modal-layer-stamp':'modal-layer-valid');

        stage.appendChild(el);

        const left=L.x*kx, top=L.y*ky, wid=L.w*kx, hei=L.h*ky;
        el.style.left=`${left}px`; el.style.top=`${top}px`; el.style.width=`${wid}px`; el.style.height=`${hei}px`;
        const img=el.querySelector('img'); if(L.preview_url) img.src=L.preview_url;

  function bindTile(card){

    const s = {

    const $selRes=card.querySelector('.select-resolution');

    const $percent=card.querySelector('.percent-input');
    const $preview=card.querySelector('.preview-img');
    const $pageInd=card.querySelector('.page-indicator');
    const $btnSend=card.querySelector('.btn-send');
    const $btnOriginal=card.querySelector('.btn-original');
    const $selRotate=card.querySelector('.select-rotate');
    const $overlay=card.querySelector('.overlay-layers');
    const $btnEnlarge=card.querySelector('.btn-enlarge');
    const $memoInput = card.querySelector('.memo-input');

    // approval UI
    const $approvalPanel = card.querySelector('.approval-panel');
    const $selRoute = card.querySelector('.sel-route');
    const $ckNeed   = card.querySelector('.ck-need-approval');
    const $ckFinal  = card.querySelector('.ck-final-approval');
    const $ckAuto   = card.querySelector('.ck-auto-author-sign');
    const $selDept  = card.querySelector('.sel-department');
    const $selReview= card.querySelector('.sel-review-user');
    const $selApprove=card.querySelector('.sel-approve-user');

    s.mode = $selMode.value;
    function refreshPercentRow(){ $percentRow.classList.toggle('d-none', s.scale!=='percent'); }
    function redraw() {
      $pageInd.textContent=`${s.page} / ${s.pages}`;
      $fileName.textContent=s.file_name||'-';
    }

    function setupRoutes(){
      const routes = injectedRoutes || [];
      fillRouteOptions($selRoute, routes);
    }

    function setApprovalControlsEnabled(enabled){
      [$selDept, $selReview, $selApprove, $selRoute, $ckNeed, $ckFinal].forEach(el=>{
        if (el) el.disabled = !enabled;
      });
    }

    function clearUserSelects(){
      $selReview.innerHTML = `<option value="">(검토자 선택)</option>`;
      $selApprove.innerHTML = `<option value="">(승인자 선택)</option>`;
      s.assignees.review = "";
      s.assignees.approve = "";
    }

    async function populateDepartmentsIfNeeded(){
      const depts = await fetchDepartments();
      $selDept.innerHTML = `<option value="">(부서 선택)</option>`;
      depts.forEach(d=>{
        const opt=document.createElement('option');
        opt.value=d; opt.textContent=d;
        $selDept.appendChild(opt);
      });
      $selDept.disabled = !(s.needApproval && !s.finalApproval && depts.length>0);
    }

    async function populateUsersByDept(dept){
      const users = await fetchUsersByDepartment(dept||"");
      const toLabel = (u)=> (u.username?`${u.username}`: (u.userid||`${u.id}`)) + (u.userid?` (${u.userid})`:'');

      const build = (sel, placeholder) => {
        sel.innerHTML = `<option value="">(${placeholder})</option>`;
        users.forEach(u=>{
          const opt = document.createElement('option');
          opt.value = u.userid || (u.id!=null?String(u.id):"");
          opt.textContent = toLabel(u);
          sel.appendChild(opt);
        });
        sel.disabled = !(s.needApproval && !s.finalApproval && users.length>0);
      };
      build($selReview, '검토자 선택');
      build($selApprove, '승인자 선택');
    }

    async function updateApprovalPanelVisibility(){
      const on = hasSignbox(s);
      $approvalPanel.classList.toggle('d-none', !on);
      if (!on){
        s.needApproval = false;
        s.finalApproval = false;
        $ckNeed.checked = false;
        $ckFinal.checked = false;
        setApprovalControlsEnabled(false);
        $selDept.value="";
        clearUserSelects();
        return;
      }
      if (!s.needApproval && !s.finalApproval){
        s.needApproval = true;
        $ckNeed.checked = true;
        $ckFinal.checked = false;
      }
      setApprovalControlsEnabled(true);
      setupRoutes();
      await populateDepartmentsIfNeeded();
      if (s.department) {
        await populateUsersByDept(s.department);
      }
    }

    // 결재 스위치/입력
    $ckNeed.addEventListener('change', async ()=>{
      s.needApproval = $ckNeed.checked;
      if (s.needApproval){
        s.finalApproval = false;
        $ckFinal.checked = false;
      }
      setApprovalControlsEnabled(s.needApproval && !s.finalApproval);
      if (s.needApproval && !s.finalApproval){

    $ckFinal.addEventListener('change', ()=>{

      if (s.routeId) applyRouteDefaultAssignees(s.routeId, $selReview, $selApprove);
      s.assignees.review  = $selReview.value || '';
      s.assignees.approve = $selApprove.value || '';

    $selReview.addEventListener('change', ()=>{
      s.assignees.review = $selReview.value || '';

    $fileInput.addEventListener('change', async (ev)=>{
      const f=ev.target.files[0];
      if(!f) return;

      // 이전 URL/상태 정리
      if (s._localUrl){ URL.revokeObjectURL(s._localUrl); s._localUrl=null; }
      if (s._bmpUrl){ URL.revokeObjectURL(s._bmpUrl); s._bmpUrl=null; }
      s.upload_id = null;
      s._originalServerUrl = null;

      s._localFile=f;
      s.file_name=f.name;
      s.pages=1;
      s.page=1;
      s.view='original';

      const ext = getFileExt(f.name);

      try {
        applyPreviewAspect(card,s);

        if (isImageExt(ext)){
          // 이미지 계열: 완전 로컬 프리뷰
          await showLocalPreviewImage(f,s,$preview);
        } else {
          // Office / PDF 계열: 원본 업로드 후 서버가 만들어 준 미리보기 이미지 사용
          await uploadOriginalIfNeeded(s);
          if (s._originalServerUrl){
            $preview.src = s._originalServerUrl + '#t=' + Date.now();
          } else {
            toast(`[${deviceNo}] 서버 미리보기 이미지를 찾을 수 없습니다.`, 'warning');
          }

        if (hasSignbox(s) && s.autoAuthorSign) ensureAuthorSignLayer(s);
        redraw();
        toast(`[${deviceNo}] 원본 미리보기 준비`, 'success');
        await updateApprovalPanelVisibility();
        card._renderLayers?.();
      }
      catch(e){
        toast(`[${deviceNo}] 원본 미리보기 실패`, 'danger');
      }
      finally{
        $fileInput.value='';
      }
    });

    // 옵션 변화 → 프리뷰
    async function refreshPreview(){
      $preview.style.transform = `rotate(${s.rotate||0}deg)`;
      applyPreviewAspect(card,s);

      // 원본 모드
      if (s.view === 'original'){
        if (s._localUrl){
          $preview.src = s._localUrl + '#t=' + Date.now();
        } else if (s._originalServerUrl){
          $preview.src = s._originalServerUrl + '#t=' + Date.now();
        } else if (s.upload_id){
          // 서버에서만 존재하는 케이스: 원본 업로드만 되어 있고 로컬 미리보기 없음
          try{
            await uploadOriginalIfNeeded(s);
            if (s._originalServerUrl){
              $preview.src = s._originalServerUrl + '#t=' + Date.now();
            }
          }catch(e){}
        }
        redraw();
        return;
      }

      // BMP 모드
      if (!s._localFile && !s.upload_id){
        toast(`[${deviceNo}] BMP 미리보기를 위해 먼저 파일을 선택하세요.`, 'warning');
        return;
      }
      try {
        await bmpPreviewJSON(s, $preview);
        redraw();
      } catch(e){
        toast(`[${deviceNo}] BMP 미리보기 실패`, 'danger');
      }
    }

    $selRes.addEventListener('change', ()=>{
      const {width,height}=parseResolution($selRes.value);
      s.uiWidth=width; s.uiHeight=height;
      refreshPercentRow();
      refreshPreview();
    });

    $selScale.addEventListener('change', ()=>{
      s.scale=$selScale.value;
      refreshPercentRow();
      refreshPreview();
    });
    $percent.addEventListener('input', ()=>{
      s.percent=parseInt($percent.value,10)||100;
      if(s.scale==='percent') refreshPreview();
    });
    $selMode.addEventListener('change', ()=>{
      s.mode=$selMode.value;
      refreshPreview();
    });
    $selRotate.addEventListener('change', ()=>{
      s.rotate=parseInt($selRotate.value,10)||0;
      refreshPreview();
    });

    card.querySelector('.btn-prev').addEventListener('click', ()=>{
      if(!s.upload_id) return;
      s.view='bmp';
      s.page=Math.max(1,(s.page||1)-1);
      refreshPreview();
    });
    card.querySelector('.btn-next').addEventListener('click', ()=>{
      if(!s.upload_id) return;
      s.view='bmp';
      s.page=Math.min(s.pages||1,(s.page||1)+1);
      refreshPreview();
    });

    // 원본/BMP 토글 버튼
    $btnOriginal.addEventListener('click', async ()=>{
      if (!s._localFile && !s.upload_id){
        toast(`[${deviceNo}] 먼저 파일을 선택하세요.`, 'warning');
        return;
      }
      if (s.view === 'original'){
        s.view = 'bmp';
        $btnOriginal.classList.add('active');
        $btnOriginal.textContent = '원본';
      } else {
        s.view = 'original';
        $btnOriginal.classList.remove('active');
        $btnOriginal.textContent = 'BMP';
      }
      await refreshPreview();
    });

    // 전송
    function mapRotateForWire(ui){
      const n=((ui%360)+360)%360;
      const is12=(s.uiWidth===1200&&s.uiHeight===1600);
      const table=is12?{0:0,90:90,180:180,270:270}:{0:270,90:0,180:90,270:180};
      return table[n]??0;
    }

    $btnSend.addEventListener('click', async ()=>{
      if(!s._localFile && !s.upload_id){
        toast(`[${deviceNo}] 전송 전에 파일을 선택하세요.`, 'warning');
        return;
      }
      try{
        await uploadOriginalIfNeeded(s);
      }catch(e){
        toast(`[${deviceNo}] 원본 업로드에 실패했습니다.`, 'danger');
        return;
      }
      if(!s.upload_id){
        toast(`[${deviceNo}] 전송을 위한 원본 핸들이 없습니다.`, 'danger');
        return;
      }

      normalizeApprovalSwitches(s);

      if (hasSignbox(s) && s.needApproval && !s.finalApproval) {
        if (!$selDept.value) return toast(`[${deviceNo}] 부서를 선택하세요.`, 'warning');
        if (!$selReview.value || !$selApprove.value) return toast(`[${deviceNo}] 검토/승인 사용자를 선택하세요.`, 'warning');
      }

      const body={
        upload_id:s.upload_id,
        page:s.page||1,
        device_id:s.device_id,
        mode:s.mode,
        scale:s.scale,
        percent:s.percent,
        rotate:mapRotateForWire(s.rotate),
        width:s.uiWidth,
        height:s.uiHeight,

        // 레이어/레이아웃
        layout_snapshot: buildLayoutSnapshot(s),

        // 결재 메타
        need_approval: hasSignbox(s) ? s.needApproval : false,
        final_approval: hasSignbox(s) ? s.finalApproval : false,
        route_id: hasSignbox(s) ? (s.routeId || null) : null,
        assignees: hasSignbox(s) ? s.assignees : { },
        memo: $memoInput.value || ""
      };
      try{
        const r=await fetch('/bulletin/sendfile',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(body)
        });
        const js=await r.json();
        toast(`[${deviceNo}] 전송 준비 완료 (job #${js.job_id})`,'info');
      }
      catch(e){
        toast(`[${deviceNo}] 전송 실패`,'danger');
      }
    });

    /* ---------- 카드 오버레이(표시용) ---------- */
    function computeImageViewportCard(surface, w, h){
      const r = surface.getBoundingClientRect();
      const scale = Math.min(r.width / w, r.height / h);
      const vw = w * scale, vh = h * scale;
      return { left:(r.width-vw)/2, top:(r.height-vh)/2, width:vw, height:vh };
    }
    function renderLayersCard(){
      const stage = $overlay.querySelector('.overlay-stage');
      const surface = $overlay.closest('.preview-surface');
      const vp = computeImageViewportCard(surface, s.uiWidth, s.uiHeight);
      stage.style.left = `${vp.left}px`;
      stage.style.top = `${vp.top}px`;
      stage.style.width = `${vp.width}px`;
      stage.style.height = `${vp.height}px`;

      const kx = vp.width / BASE_W;
      const ky = vp.height / BASE_H;

      stage.innerHTML = '';
      s.layers.forEach(L=>{
        if(L.type==='signbox'){
          const el=document.createElement('div');
          el.className='layer-item'; el.dataset.id=L.id;
          el.innerHTML=`<div class="title">결재란</div>`;
          stage.appendChild(el);
          el.style.left  = `${L.parent.x * kx}px`;
          el.style.top   = `${L.parent.y * ky}px`;
          el.style.width = `${L.parent.w * kx}px`;
          el.style.height= `${L.parent.h * ky}px`;

          const tpl = L.tpl || buildFiveSlotsTemplate();
          const baselineY = tpl.line_pos_ratio ?? 0.72;
          const hpad      = tpl.line_hpad_ratio ?? 0.08;
          const thick = 1;
          const wid = L.parent.w * kx, hei = L.parent.h * ky;

          (L.slots||[]).forEach(S=>{
            const d=document.createElement('div');
            d.className='slot-rect';
            const sw = Math.round(S.w_rel*wid), sh = Math.round(S.h_rel*hei);
            d.style.left = `${Math.round(S.x_rel*wid)}px`;
            d.style.top  = `${Math.round(S.y_rel*hei)}px`;
            d.style.width= `${sw}px`;
            d.style.height= `${sh}px`;
            d.style.borderColor = tpl.border_color || '#0d6efd';

            const lab=document.createElement('div');
            lab.className='slot-label';
            lab.textContent = S.label || S.role || '';
            if (tpl.font_color) lab.style.color = tpl.font_color;
            d.appendChild(lab);

            const line=document.createElement('div');
            line.className='slot-baseline';
            const lineY = Math.round(sh * baselineY);
            const lineLeft = Math.round(sw * hpad);
            const lineRight= Math.round(sw * (1 - hpad));
            line.style.top = `${lineY}px`;
            line.style.left= `${lineLeft}px`;
            line.style.width=`${Math.max(0, lineRight - lineLeft)}px`;
            line.style.height=`${thick}px`;
            if (tpl.line_color) line.style.background = tpl.line_color;
            d.appendChild(line);

            el.appendChild(d);
          });
        }

        if(L.type==='stamp' || L.type==='validity' || L.type==='sign'){
          const el=document.createElement('div');
          const cls = (L.type==='stamp')?'layer-stamp':(L.type==='validity'?'layer-valid':'layer-sign');
          el.className='layer-item '+cls;
          el.dataset.id=L.id;
          el.innerHTML=`<div class="title">${L.type==='stamp'?'직인':(L.type==='validity'?'유효기간':'서명')}</div><img alt="">`;
          stage.appendChild(el);
          el.style.left  = `${L.x * kx}px`;
          el.style.top   = `${L.y * ky}px`;
          el.style.width = `${L.w * kx}px`;
          el.style.height= `${L.h * ky}px`;
          const img=el.querySelector('img');
          if (L.preview_url) img.src=L.preview_url;
        }
      });
      updateApprovalPanelVisibility();
    }

    function init(){
      refreshPercentRow();
      applyPreviewAspect(card,s);
      setApprovalControlsEnabled(false);
      updateApprovalPanelVisibility();
      $btnOriginal.classList.remove('active');
      $btnOriginal.textContent = 'BMP';
    }
    init();

    card._state = s;
    card._renderLayers = renderLayersCard;
    card._onStateChanged = async () => {
      if (hasSignbox(s) && s.autoAuthorSign) ensureAuthorSignLayer(s);
      await updateApprovalPanelVisibility();
    };

    $btnEnlarge.addEventListener('click', async ()=>{
      if(!s.upload_id){
        if (!s._localFile){
          toast(`[${deviceNo}] 먼저 파일을 선택하세요.`, 'warning');
          return;
        }
        try{
          await uploadOriginalIfNeeded(s);
        }catch(e){
          toast(`[${deviceNo}] 원본 업로드 실패`, 'danger');
          return;
        }
      }
      modalState = s;
      modalCurrentCard = card;
      modalRotate.value = String(((s.rotate%360)+360)%360);
      await refreshModalPreview();
      renderLayersModal();
      bsModal.show();
    });
  }

  // 모든 카드 바인딩
  document.querySelectorAll('#tiles .card').forEach(bindTile);

  // 전체 전송
  document.getElementById('btn-send-all').addEventListener('click', ()=>{
    document.querySelectorAll('#tiles .card .btn-send').forEach(btn=>btn.click());
  });

  // 레이아웃 저장(모든 카드 상태 취합)
  document.getElementById('btn-save-layouts').addEventListener('click', async ()=>{
    const cards=[...document.querySelectorAll('#tiles .card')];
    const payload = cards.map(c=>{
      const st = c._state || {};
      normalizeApprovalSwitches(st);
      return {
        device_id: c.dataset.deviceId,
        upload_id: st.upload_id || null,
        layout: buildLayoutSnapshot(st),
        approval_meta: {
          need_approval: hasSignbox(st) ? !!st.needApproval : false,
          final_approval: hasSignbox(st) ? !!st.finalApproval : false,
          route_id: hasSignbox(st) ? (st.routeId || null) : null,
          department: hasSignbox(st) ? (st.department || "") : "",
          assignees: hasSignbox(st) ? (st.assignees || {}) : {}
        }
      };
    });
    try{
      await fetch('/bulletin/sign_layout/save_batch',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items:payload})
      });
      toast('레이아웃 저장 완료','success');
    }catch(e){
      toast('레이아웃 저장 실패','danger');
    }
  });

})();
</script>
{% endblock %}
