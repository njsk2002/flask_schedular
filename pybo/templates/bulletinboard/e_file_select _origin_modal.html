{% extends 'e_base.html' %}

{% block content %}
<div class="container-fluid py-3">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h3 class="mb-0">E-Ink 전송 대시보드 (3×2)</h3>
    <div class="d-flex gap-2">
      <button id="btn-save-layouts" class="btn btn-outline-secondary">레이아웃 저장</button>
      <button id="btn-send-all" class="btn btn-primary">전체 전송</button>
    </div>
  </div>

  <!-- 상태 알림 -->
  <div id="toast-area" class="position-fixed top-0 end-0 p-3" style="z-index:1080;"></div>

  <!-- 프리뷰/버튼/오버레이 CSS -->
  <style>
    .btn-nav-sm { padding:.15rem .35rem; font-size:.75rem; line-height:1; }
    .preview-surface {
      height: clamp(300px, 40vh, 520px);
      width: auto; max-width:100%; margin-inline:auto;
      background:#f8f9fa; overflow:hidden; border-radius:.375rem; position:relative;
    }
    .preview-img { width:100%; height:100%; object-fit:contain; }

    /* 카드 오버레이(표시용, 편집은 모달에서만) */
    .overlay-layers, .modal-overlay { position:absolute; inset:0; }
    .overlay-stage { position:absolute; /* 크기/좌표는 JS에서 실제 이미지 뷰포트에 맞게 설정 */ }

    .layer-item {
      position:absolute; border:1px dashed #0d6efd; background:rgba(13,110,253,.05);
      user-select:none;
    }
    .layer-item .title { position:absolute; top:-18px; left:0; font-size:12px; color:#0d6efd; }
    .slot-rect { position:absolute; border:1px solid rgba(13,110,253,.6); background:rgba(13,110,253,.04); }
    .slot-label {
      position:absolute; left:4px; top:4px; font-size:12px; line-height:1;
      color:#0d6efd; background:rgba(255,255,255,.7); padding:2px 4px; border-radius:3px;
    }
    .slot-baseline {
      position:absolute; left:0; height:1px; background:#0d6efd;
    }
    .layer-stamp img, .layer-valid img { display:block; width:100%; height:100%; object-fit:contain; }

    /* ===== 모달 전용 ===== */
    .modal-preview-wrap {
      width:100%; max-height:80vh; background:#f8f9fa; border-radius:.375rem; overflow:hidden;
      /* aspect-ratio는 JS에서 modalState.uiWidth:uiHeight로 동적으로 조정 */
      position:relative; display:flex; align-items:center; justify-content:center;
    }
    .modal-preview-img { width:100%; height:100%; object-fit:contain; }
    .modal-overlay { position:absolute; inset:0; }
    .modal-edit-active .modal-overlay { pointer-events:auto; }
    .modal-layer { position:absolute; border:1px dashed #198754; background:rgba(25,135,84,.06); cursor:move; }
    .modal-layer .handle { position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:#198754; cursor:se-resize; border-radius:2px; }
    .modal-layer .title { position:absolute; top:-18px; left:0; font-size:12px; color:#198754; }
    .modal-slot { position:absolute; border:1px solid rgba(25,135,84,.6); background:rgba(25,135,84,.05); }
    .modal-slot-label {
      position:absolute; left:6px; top:6px; font-size:14px; line-height:1;
      color:#14532d; background:rgba(255,255,255,.8); padding:2px 6px; border-radius:3px;
      font-weight:600;
    }
    .modal-slot-baseline {
      position:absolute; left:0; height:2px; background:#198754;
    }
    .modal-layer-stamp img, .modal-layer-valid img { display:block; width:100%; height:100%; object-fit:contain; }
  </style>

  <!-- 3×2 그리드 -->
  <div id="tiles" class="row row-cols-1 row-cols-md-3 g-3">
    {% for i in range(1,7) %}
    {% set num = "%02d" % i %}
    <div class="col">
      <div class="card shadow-sm h-100" data-device-no="{{ num }}" data-device-id="E{{ num }}">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>E-INK/{{ num }}</strong>
          <span class="badge text-bg-secondary">E{{ num }}</span>
        </div>

        <div class="card-body d-flex flex-column gap-2">
          <!-- 1ROW -->
          <div class="d-flex flex-column gap-2">
            <div class="d-flex align-items-center gap-2">
              <div class="flex-grow-1 text-truncate">
                <span class="fw-semibold">파일명:</span>
                <span class="file-name" title="파일명">-</span>
              </div>
              <input type="file" class="d-none file-input"
                     accept=".pdf,.png,.jpg,.jpeg,.bmp,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.csv,.txt"/>
              <button class="btn btn-sm btn-outline-primary btn-choose">선택</button>
            </div>
            <input type="text" class="form-control form-control-sm memo-input" placeholder="메모 입력(옵션)">
          </div>

          <!-- 2ROW -->
          <div class="row g-2">
            <div class="col-4">
              <label class="form-label mb-1 small">해상도</label>
              <select class="form-select form-select-sm select-resolution">
                <option value="480x800" selected>480×800</option>
                <option value="1200x1600">1200×1600</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label mb-1 small">화면선택</label>
              <select class="form-select form-select-sm select-scale">
                <option value="fit" selected>FIT</option>
                <option value="fill">FILL</option>
                <option value="percent">PERCENT</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label mb-1 small">컬러</label>
              <select class="form-select form-select-sm select-mode">
                <option value="BWRYBG" selected>COLOR6 (BWRYBG)</option>
                <option value="BW">MONO (BW)</option>
                <option value="BWRY">COLOR (BWRY)</option>
              </select>
            </div>
            <div class="col-12 percent-row d-none">
              <label class="form-label mb-1 small">배율(%)</label>
              <input type="range" class="form-range percent-input" min="50" max="200" step="1" value="100">
            </div>
          </div>

          <!-- 3ROW: 프리뷰 + 오버레이(표시만) -->
          <div class="preview-wrap flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="preview-surface border" style="aspect-ratio: 3 / 5;">
              <img class="preview-img" src="" alt="미리보기">
              <div class="overlay-layers position-absolute top-0 start-0 w-100 h-100">
                <div class="overlay-stage"></div>
              </div>
            </div>
          </div>

          <!-- 4ROW: 네비/옵션/파일 수정 -->
          <div class="d-flex align-items-center justify-content-between">
            <div class="btn-group" role="group">
              <button class="btn btn-outline-secondary btn-nav-sm btn-prev" type="button">이전</button>
              <span class="px-2 small page-indicator">- / -</span>
              <button class="btn btn-outline-secondary btn-nav-sm btn-next" type="button">이후</button>
            </div>

            <div class="d-flex gap-2 align-items-center">
              <div class="d-flex align-items-center gap-1">
                <label class="form-label mb-0 small">회전</label>
                <select class="form-select form-select-sm select-rotate" style="width:auto;">
                  <option value="0" selected>0°</option>
                  <option value="90">90°</option>
                  <option value="180">180°</option>
                  <option value="270">270°</option>
                </select>
              </div>

              <!-- 원본/BMP 토글 -->
              <button class="btn btn-outline-dark btn-original" type="button" title="원본 보기 토글">원본</button>

              <!-- 파일 수정(모달) -->
              <button class="btn btn-outline-primary btn-enlarge" type="button">파일 수정</button>

              <button class="btn btn-success btn-send" type="button">전송</button>
            </div>
          </div>

        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<!-- ===== 파일 수정 모달 ===== -->
<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">파일 수정 / 선택 해상도 편집</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <div class="modal-preview-wrap" id="modalPreviewWrap">
          <img id="modalPreviewImg" class="modal-preview-img" alt="미리보기(선택 해상도)">
          <div id="modalOverlay" class="modal-overlay">
            <div class="overlay-stage" id="modalOverlayStage"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <div class="btn-group" role="group">
          <button class="btn btn-outline-secondary btn-nav-sm" id="modalPrev">이전</button>
          <span class="px-2 small" id="modalPage">- / -</span>
          <button class="btn btn-outline-secondary btn-nav-sm" id="modalNext">이후</button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small">회전</label>
          <select class="form-select form-select-sm" id="modalRotate" style="width:auto;">
            <option value="0">0°</option>
            <option value="90">90°</option>
            <option value="180">180°</option>
            <option value="270">270°</option>
          </select>

          <!-- 편집 버튼(모달 전용) -->
          <button class="btn btn-outline-secondary" id="modalEditSignbox">결재란</button>
          <button class="btn btn-outline-secondary" id="modalEditStamp">직인</button>
          <button class="btn btn-outline-secondary" id="modalEditValid">유효기간</button>

          <!-- 레이어 이미지 업로드(모달 전용) -->
          <input type="file" id="modalLayerFile" class="d-none" accept=".png,.jpg,.jpeg"/>

          <button class="btn btn-outline-secondary" id="modalRefresh">새로고침</button>
          <button class="btn btn-primary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script type="application/json" id="devices-json">
  {{ devices|default([], true)|tojson }}
</script>

<script>
(() => {
  /* ---------- 공통 유틸 ---------- */
  const toJSON = (id) => { try{ const t=document.getElementById(id); return t && t.textContent.trim()? JSON.parse(t.textContent):[]; }catch(e){ return []; } };
  const injected = toJSON('devices-json');
  const fallback = [
    {device_no:'01', device_id:'E01', supports:['BW','BWRY','BWRYBG'], default_width:1200, default_height:1600},
    {device_no:'02', device_id:'E02', supports:['BW','BWRY','BWRYBG'], default_width:1200, default_height:1600},
    {device_no:'03', device_id:'E03', supports:['BW','BWRY','BWRYBG'], default_width:1200, default_height:1600},
    {device_no:'04', device_id:'E04', supports:['BW','BWRY','BWRYBG'], default_width:1200, default_height:1600},
    {device_no:'05', device_id:'E05', supports:['BW','BWRY','BWRYBG'], default_width:1200, default_height:1600},
    {device_no:'06', device_id:'E06', supports:['BW','BWRY','BWRYBG'], default_width:1200, default_height:1600},
  ];
  const devices = (Array.isArray(injected) && injected.length)? injected : fallback;

  function toast(msg, type='info'){
    const id = 't'+Date.now()+Math.random().toString(16).slice(2);
    const el = document.createElement('div');
    el.id=id; el.className = `toast align-items-center text-bg-${type} border-0 show`;
    el.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button></div>`;
    (document.querySelector('#toast-area')||document.body).appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }

  const parseResolution = v => { const [w,h]=v.split('x').map(Number); return {width:w, height:h}; };
  const getPreviewBoxDims = (selW,selH)=>{
    if (selW===800 && selH===480) return {pw:3, ph:5};
    if (selW===1200 && selH===1600) return {pw:3, ph:4};
    return {pw:selW, ph:selH};
  };
  function applyPreviewAspect(card, s){
    const surface = card.querySelector('.preview-surface');
    if(!surface) return;
    const {pw,ph}=getPreviewBoxDims(s.uiWidth, s.uiHeight);
    surface.style.aspectRatio = `${pw} / ${ph}`;
  }

  async function previewJSON(s, imgEl, raw=0){
    const body = {
      upload_id:s.upload_id, width:s.uiWidth, height:s.uiHeight,
      mode:s.mode, scale:s.scale, percent:s.percent, rotate:s.rotate,
      layers:s.layers, raw
    };
    const r = await fetch('/bulletin/preview_blob', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error('preview_blob json failed');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    imgEl.src = url + '#t=' + Date.now();
    if (s._prevUrl) URL.revokeObjectURL(s._prevUrl);
    s._prevUrl = url;
  }
  async function previewFile(file, s, imgEl){
    const fd = new FormData();
    fd.append('file', file);
    fd.append('width', s.uiWidth); fd.append('height', s.uiHeight);
    fd.append('mode', s.mode); fd.append('scale', s.scale);
    fd.append('percent', s.percent); fd.append('rotate', s.rotate);
    fd.append('raw', 0);
    const r = await fetch('/bulletin/preview_blob', {method:'POST', body:fd});
    if(!r.ok) throw new Error('preview_blob multipart failed');
    const upid = r.headers.get('X-Upload-Id'); if(upid) s.upload_id = parseInt(upid,10);
    const blob = await r.blob(); const url = URL.createObjectURL(blob);
    if (s._prevUrl) URL.revokeObjectURL(s._prevUrl);
    s._prevUrl = url; imgEl.src = url + '#t=' + Date.now();
  }

  /* ---------- 좌표/슬롯 도우미 ---------- */
  const BASE_W = 1200, BASE_H = 1600; // 내부 저장 좌표계(절대)
  const n2px = (n, total)=> Math.round(n*total);

  // 결재란(3칸/5칸 공용) 레이아웃 & 스타일 파라미터
  function buildFiveSlotsTemplate(){
    return {
      // ----- 레이아웃 비율(필요시 조정) -----
      label_ratio: 0.01,               // 좌/우 라벨 폭 (부모 w 대비)
      gap_ratio: 0.01,                 // 슬롯 사이 간격
      left3_ratio: [0.33, 0.33, 0.33], // [작성,검토,승인]
      right2_ratio: [],                // 5칸 쓰면 [0.28,0.28] 처럼 지정 (빈 배열이면 3칸 모드)
      vpad_ratio: 0.06,                // 상/하 여백 비율

      // ----- 바깥쪽 가로 패딩(슬롯묶음 vs modal-layer) -----
      outer_hpad_ratio: 0.004,          // ← 좌우 각각 0.4%만 남김(원하면 0)

      // ----- 서명선(baseline) 파라미터 -----
      line_pos_ratio: 0.72,            // 슬롯 높이 대비 Y 위치 (0~1)
      line_hpad_ratio: 0.08,           // 좌우 여백 (0~0.5)
      line_thickness_px: 2,            // 선 두께(px) - 서버/모달에서 스케일 적용

      // ----- [신규] 서버 렌더 스타일 힌트 -----
      font_size_px: 28,                // 라벨 글자 크기(px)
      font_color: '#14312d',           // 라벨 글자색
      line_color: '#198754',           // 서명선 색
      border_color: '#198754'          // 슬롯/박스 테두리 색
    };
  }

  // 부모(px, BASE_W×BASE_H 기준) + 템플릿 → 슬롯 상대좌표
  function makeSlotsFromTemplate(parent, tpl){
    const {x,y,w,h} = parent;
    const lr = tpl.label_ratio, gap = tpl.gap_ratio, vp = tpl.vpad_ratio;
    const top = y + h*vp;
    const usableH = h*(1 - 2*vp);

    const left3 = tpl.left3_ratio || [];
    const right2 = Array.isArray(tpl.right2_ratio) ? tpl.right2_ratio : [];

    if (!right2.length) {
      // ===== 3칸(작성/검토/승인) 모드 =====
      const usableW = w*(1 - lr - 3*gap); // 라벨 1개 + 슬롯간격 2개
      const x0 = x + w*lr;
      const x1 = x0 + usableW*left3[0] + w*gap;
      const x2 = x1 + usableW*left3[1] + w*gap;

      const slotsPx = [
        {x:x0, y:top, w:usableW*left3[0], h:usableH, role:'author',  label:'작성'},
        {x:x1, y:top, w:usableW*left3[1], h:usableH, role:'review',  label:'검토'},
        {x:x2, y:top, w:usableW*left3[2], h:usableH, role:'approve', label:'승인'},
      ];
      return slotsPx.map(r=>({
        role:r.role, label:r.label,
        x_rel:(r.x-x)/w, y_rel:(r.y-y)/h, w_rel:r.w/w, h_rel:r.h/h
      }));
    }

    // ===== 5칸(좌3+우2) 모드 (기존) =====
    const usableW = w*(1 - 2*lr - 5*gap);
    const x0 = x + w*lr;
    const x1 = x0 + usableW*left3[0] + w*gap;
    const x2 = x1 + usableW*left3[1] + w*gap;
    const xLabel2 = x + w - (w*lr) - (usableW*(right2[0]+right2[1]) + w*gap);
    const x3 = xLabel2 + w*lr + w*gap;
    const x4 = x3 + usableW*right2[0] + w*gap;

    const slots5 = [
      {x:x0, y:top, w:usableW*left3[0], h:usableH, role:'author',   label:'작성'},
      {x:x1, y:top, w:usableW*left3[1], h:usableH, role:'review',   label:'검토'},
      {x:x2, y:top, w:usableW*left3[2], h:usableH, role:'approve',  label:'승인'},
      {x:x3, y:top, w:usableW*right2[0], h:usableH, role:'review2', label:'검토'},
      {x:x4, y:top, w:usableW*right2[1], h:usableH, role:'approve2',label:'승인'},
    ];
    return slots5.map(r=>({
      role:r.role, label:r.label,
      x_rel:(r.x-x)/w, y_rel:(r.y-y)/h, w_rel:r.w/w, h_rel:r.h/h
    }));
  }


  function createSignboxLayerDefault(){
    const parent = { x:Math.round(BASE_W*0.05), y:Math.round(BASE_H*0.72),
                     w:Math.round(BASE_W*0.90), h:Math.round(BASE_H*0.18) };
    const tpl = buildFiveSlotsTemplate();
    const slots = makeSlotsFromTemplate(parent, tpl);
    return { id:'signbox-1', type:'signbox', parent, tpl, slots, z:2 };
  }

  /* ---------- 모달(전역 싱글톤) ---------- */
  const modalEl = document.getElementById('previewModal');
  const modalWrap = document.getElementById('modalPreviewWrap');
  const modalImg = document.getElementById('modalPreviewImg');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalPage = document.getElementById('modalPage');
  const modalRotate = document.getElementById('modalRotate');
  const modalPrev = document.getElementById('modalPrev');
  const modalNext = document.getElementById('modalNext');
  const modalRefresh = document.getElementById('modalRefresh');
  const modalEditSignbox = document.getElementById('modalEditSignbox');
  const modalEditStamp = document.getElementById('modalEditStamp');
  const modalEditValid = document.getElementById('modalEditValid');
  const modalLayerFile = document.getElementById('modalLayerFile');
  const bsModal = new bootstrap.Modal(modalEl);

  let modalState = null;          // 현재 편집 중인 카드 상태
  let modalCurrentCard = null;    // 카드 DOM
  let modalEditMode = 'none';     // 'signbox'|'stamp'|'validity'

  function setModalEditActive(on){
    modalEl.querySelector('.modal-preview-wrap')?.classList.toggle('modal-edit-active', !!on);
  }

  // 모달 aspect-ratio를 선택 해상도에 맞게 설정
  function applyModalAspect(){
    if(!modalState) return;
    const w = modalState.uiWidth || BASE_W;
    const h = modalState.uiHeight || BASE_H;
    // 480×800은 3/5, 1200×1600은 3/4 등 실제 비율 사용
    modalWrap.style.aspectRatio = `${w} / ${h}`;
  }

  // 선택 해상도(모달의 s.uiWidth/s.uiHeight)로 서버 프리뷰 생성
  async function refreshModalPreview(){
    if(!modalState || !modalState.upload_id){ toast('편집할 파일이 없습니다.','warning'); return; }
    applyModalAspect();
    const body = {
      upload_id: modalState.upload_id,
      width: modalState.uiWidth || BASE_W,   // ← 모달은 선택된 해상도 사용
      height: modalState.uiHeight || BASE_H,
      mode: modalState.mode, scale: modalState.scale, percent: modalState.percent,
      rotate: modalState.rotate, raw: (modalState.view==='original')?1:0,
      layers: modalState.layers
    };
    const r = await fetch('/bulletin/preview_blob', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if(!r.ok) { toast('모달 미리보기 실패','danger'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    modalImg.src = url + '#t=' + Date.now();
    modalPage.textContent = `${modalState.page||1} / ${modalState.pages||1}`;
  }

  function makeDragResize(el, container, onCommit){
    let mode=null, sx=0, sy=0, sl=0, st=0, sw=0, sh=0;
    el.addEventListener('pointerdown', e=>{
      const rect=el.getBoundingClientRect(), orect=container.getBoundingClientRect();
      const onHandle = e.target.closest('.handle'); mode=onHandle?'resize':'move';
      sx=e.clientX; sy=e.clientY; sl=rect.left-orect.left; st=rect.top-orect.top; sw=rect.width; sh=rect.height;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e=>{
      if(!mode) return; const dx=e.clientX-sx, dy=e.clientY-sy;
      if(mode==='move'){ el.style.left=`${sl+dx}px`; el.style.top=`${st+dy}px`; }
      else{ el.style.width=`${Math.max(40, sw+dx)}px`; el.style.height=`${Math.max(40, sh+dy)}px`; }
    });
    el.addEventListener('pointerup', ()=>{
      const orect=container.getBoundingClientRect();
      const nx=parseFloat(el.style.left)||0, ny=parseFloat(el.style.top)||0;
      const nw=parseFloat(el.style.width)||0, nh=parseFloat(el.style.height)||0;
      mode=null; onCommit(nx,ny,nw,nh, orect);
    });
  }

  // 모달 오버레이 렌더 (스케일 적용: BASE→현재 미리보기 픽셀)
    function renderLayersModal(){
      if(!modalState) return;
      const stage = document.getElementById('modalOverlayStage');
      const vp = computeImageViewport(document.getElementById('modalPreviewWrap'),
                                      modalState.uiWidth||BASE_W, modalState.uiHeight||BASE_H);
      stage.style.left = `${vp.left}px`;
      stage.style.top = `${vp.top}px`;
      stage.style.width = `${vp.width}px`;
      stage.style.height= `${vp.height}px`;

      const kx = vp.width / BASE_W, ky = vp.height / BASE_H;
      stage.innerHTML = '';

      (modalState.layers||[]).forEach(L=>{
        if(L.type==='signbox'){
          const el=document.createElement('div');
          el.className='modal-layer'; el.dataset.id=L.id;
          el.innerHTML=`<div class="title">결재란</div><div class="handle"></div>`;
          stage.appendChild(el); // ←★★ stage에 붙임

          const left=L.parent.x*kx, top=L.parent.y*ky, wid=L.parent.w*kx, hei=L.parent.h*ky;
          el.style.left=`${left}px`; el.style.top=`${top}px`; el.style.width=`${wid}px`; el.style.height=`${hei}px`;

          const tpl = L.tpl || buildFiveSlotsTemplate();
          const baselineY = (tpl.line_pos_ratio ?? 0.72);
          const hpad = (tpl.line_hpad_ratio ?? 0.08);
          // 모달은 확대 기준이라 두께도 스케일 반영
          const thick = Math.max(1, Math.round((tpl.line_thickness_px ?? 2) * Math.min(kx,ky)));

          (L.slots||[]).forEach(S=>{
            const sdiv=document.createElement('div'); sdiv.className='modal-slot';
            const sx = Math.round(S.x_rel*wid), sy=Math.round(S.y_rel*hei);
            const sw = Math.round(S.w_rel*wid), sh=Math.round(S.h_rel*hei);
            sdiv.style.left=`${sx}px`; sdiv.style.top=`${sy}px`;
            sdiv.style.width=`${sw}px`; sdiv.style.height=`${sh}px`;
            // 테두리/라벨 색
            if (tpl.border_color) sdiv.style.borderColor = tpl.border_color;

            const lab=document.createElement('div');
            lab.className='modal-slot-label';
            lab.textContent = S.label || S.role || '';
            if (tpl.font_color) lab.style.color = tpl.font_color;
            sdiv.appendChild(lab);

            const line=document.createElement('div');
            line.className='modal-slot-baseline';
            const lineY = Math.round(sh * baselineY);
            const lineLeft = Math.round(sw * hpad);
            const lineRight= Math.round(sw * (1 - hpad));
            line.style.top = `${lineY}px`;
            line.style.left = `${lineLeft}px`;
            line.style.width= `${Math.max(0, lineRight - lineLeft)}px`;
            line.style.height= `${thick}px`;
            if (tpl.line_color) line.style.background = tpl.line_color;
            sdiv.appendChild(line);

            el.appendChild(sdiv);
          });

          // 드래그/리사이즈 컨테이너도 stage로 변경
          makeDragResize(el, stage, (nx,ny,nw,nh, orect)=>{
            const kx0 = orect.width/BASE_W, ky0 = orect.height/BASE_H;
            L.parent={ x:Math.round(nx/kx0), y:Math.round(ny/ky0),
                      w:Math.round(nw/kx0), h:Math.round(nh/ky0) };
            L.slots = makeSlotsFromTemplate(L.parent, L.tpl);
            renderLayersModal();
            modalCurrentCard?._renderLayers?.();
            refreshModalPreview();
          });
        }

        if(L.type==='stamp' || L.type==='validity'){
          const el=document.createElement('div');
          el.className='modal-layer '+(L.type==='stamp'?'modal-layer-stamp':'modal-layer-valid');
          el.dataset.id=L.id;
          el.innerHTML=`<div class="title">${L.type==='stamp'?'직인':'유효기간'}</div><div class="handle"></div><img alt="">`;
          stage.appendChild(el); // ←★★ stage에 붙임

          const left=L.x*kx, top=L.y*ky, wid=L.w*kx, hei=L.h*ky;
          el.style.left=`${left}px`; el.style.top=`${top}px`; el.style.width=`${wid}px`; el.style.height=`${hei}px`;
          const img=el.querySelector('img'); if(L.preview_url) img.src=L.preview_url;

          makeDragResize(el, stage, (nx,ny,nw,nh, orect)=>{
            const kx0 = orect.width/BASE_W, ky0 = orect.height/BASE_H;
            L.x=Math.round(nx/kx0); L.y=Math.round(ny/ky0);
            L.w=Math.round(nw/kx0); L.h=Math.round(nh/ky0);
            modalCurrentCard?._renderLayers?.();
            refreshModalPreview();
          });
        }
      });

      setModalEditActive(modalEditMode!=='none');
    }


  // 모달 네비/회전/새로고침 (전역 1회 바인딩)
  modalPrev.onclick = async ()=>{
    if(!modalState || !modalState.upload_id) return toast('편집할 파일이 없습니다.','warning');
    modalState.view='processed'; modalState.page=Math.max(1,(modalState.page||1)-1);
    await refreshModalPreview();
  };
  modalNext.onclick = async ()=>{
    if(!modalState || !modalState.upload_id) return toast('편집할 파일이 없습니다.','warning');
    modalState.view='processed'; modalState.page=Math.min(modalState.pages||1,(modalState.page||1)+1);
    await refreshModalPreview();
  };
  modalRotate.onchange = async (e)=>{
    if(!modalState) return;
    modalState.rotate = parseInt(e.target.value,10)||0;
    await refreshModalPreview();
  };
  modalRefresh.onclick = refreshModalPreview;

  // 모달: 편집 버튼
  modalEditSignbox.onclick = ()=>{
    if(!modalState) return toast('모달 상태가 없습니다.','warning');
    modalEditMode = (modalEditMode==='signbox')?'none':'signbox';
    if(!modalState.layers.find(L=>L.type==='signbox')) modalState.layers.push(createSignboxLayerDefault());
    renderLayersModal(); modalCurrentCard?._renderLayers?.();
  };
  modalEditStamp.onclick = ()=>{
    if(!modalState) return toast('모달 상태가 없습니다.','warning');
    modalEditMode = (modalEditMode==='stamp')?'none':'stamp';
    renderLayersModal();
    if(modalEditMode==='stamp'){ modalLayerFile.dataset.layerType='stamp'; modalLayerFile.click(); }
  };
  modalEditValid.onclick = ()=>{
    if(!modalState) return toast('모달 상태가 없습니다.','warning');
    modalEditMode = (modalEditMode==='validity')?'none':'validity';
    renderLayersModal();
    if(modalEditMode==='validity'){ modalLayerFile.dataset.layerType='validity'; modalLayerFile.click(); }
  };

  // 모달: 레이어 이미지 업로드
  modalLayerFile.addEventListener('change', async (ev)=>{
    const f=ev.target.files?.[0]; if(!f) return;
    if(!modalState) return toast('모달 상태가 없습니다.','warning');
    try{
      const fd=new FormData(); fd.append('file', f);
      const r=await fetch('/bulletin/layer_upload',{method:'POST', body:fd});
      if(!r.ok) throw new Error('layer_upload failed');
      const js=await r.json();
      const L = { id:'L'+Date.now().toString(16), type:(modalLayerFile.dataset.layerType==='validity')?'validity':'stamp',
                  preview_url:js.preview_url, upload_token:js.upload_token,
                  x:Math.round(BASE_W*0.70), y:Math.round(BASE_H*0.10),
                  w:Math.round(BASE_W*0.20), h:Math.round(BASE_H*0.20), z:3 };
      modalState.layers.push(L);
      renderLayersModal(); modalCurrentCard?._renderLayers?.(); await refreshModalPreview();
      toast('레이어 추가 완료','success');
    }catch(e){ toast('레이어 업로드 실패','danger'); }
    finally{ ev.target.value=''; }
  });

  // 모달 닫힐 때 상태 리셋
  modalEl.addEventListener('hidden.bs.modal', ()=>{
    modalState = null;
    modalCurrentCard = null;
    modalEditMode = 'none';
    modalOverlay.innerHTML = '';
  });

  /* ---------- 카드 바인딩 ---------- */
  function bindTile(card){
    const deviceNo = card.dataset.deviceNo;
    const deviceId = card.dataset.deviceId;
    const spec = devices.find(d=>d.device_no===deviceNo) || {};
    const s = {
      device_no: deviceNo, device_id: deviceId,
      upload_id:null, file_name:'-', pages:1, page:1,
      uiWidth: spec.default_width||480, uiHeight: spec.default_height||800,
      mode:'BWRYBG', scale:'fit', percent:100, rotate:0, view:'processed',
      layers:[], _prevUrl:null
    };

    const $fileName=card.querySelector('.file-name');
    const $fileInput=card.querySelector('.file-input');
    const $btnChoose=card.querySelector('.btn-choose');
    const $selRes=card.querySelector('.select-resolution');
    const $selScale=card.querySelector('.select-scale');
    const $selMode=card.querySelector('.select-mode');
    const $percentRow=card.querySelector('.percent-row');
    const $percent=card.querySelector('.percent-input');
    const $preview=card.querySelector('.preview-img');
    const $pageInd=card.querySelector('.page-indicator');
    const $btnSend=card.querySelector('.btn-send');
    const $btnOriginal=card.querySelector('.btn-original');
    const $selRotate=card.querySelector('.select-rotate');
    const $overlay=card.querySelector('.overlay-layers');
    const $btnEnlarge=card.querySelector('.btn-enlarge');

    s.mode = $selMode.value;
    function refreshPercentRow(){ $percentRow.classList.toggle('d-none', s.scale!=='percent'); }
    function redraw() { $pageInd.textContent=`${s.page} / ${s.pages}`; $fileName.textContent=s.file_name||'-'; }

    // 파일 선택
    $btnChoose.addEventListener('click', ()=> $fileInput.click());
    $fileInput.addEventListener('change', async (ev)=>{
      const f=ev.target.files[0]; if(!f) return;
      s.file_name=f.name; s.pages=1; s.page=1; s.view='processed';
      try { applyPreviewAspect(card,s); await previewFile(f,s,$preview); redraw(); toast(`[${deviceNo}] 미리보기 준비`,'success'); }
      catch(e){ toast(`[${deviceNo}] 미리보기 실패`,'danger'); }
      finally{ $fileInput.value=''; }
    });

    // 옵션 변화 → 프리뷰
    async function refreshPreview(){ if(!s.upload_id) return;
      try { applyPreviewAspect(card,s); await previewJSON(s,$preview, s.view==='original'?1:0); redraw(); }
      catch(e){ toast(`[${deviceNo}] 미리보기 실패`,'danger'); }
    }

    $selRes.addEventListener('change', ()=>{ const {width,height}=parseResolution($selRes.value);
      s.uiWidth=width; s.uiHeight=height; applyPreviewAspect(card,s); refreshPercentRow(); refreshPreview(); });

    $selScale.addEventListener('change', ()=>{ s.scale=$selScale.value; refreshPercentRow(); refreshPreview(); });
    $percent.addEventListener('input', ()=>{ s.percent=parseInt($percent.value,10)||100; if(s.scale==='percent') refreshPreview(); });
    $selMode.addEventListener('change', ()=>{ s.mode=$selMode.value; refreshPreview(); });
    $selRotate.addEventListener('change', ()=>{ s.rotate=parseInt($selRotate.value,10)||0; applyPreviewAspect(card,s); refreshPreview(); });

    card.querySelector('.btn-prev').addEventListener('click', ()=>{ if(!s.upload_id) return; s.view='processed'; s.page=Math.max(1,(s.page||1)-1); refreshPreview(); });
    card.querySelector('.btn-next').addEventListener('click', ()=>{ if(!s.upload_id) return; s.view='processed'; s.page=Math.min(s.pages||1,(s.page||1)+1); refreshPreview(); });

    // 원본 ↔ BMP 토글
    $btnOriginal.addEventListener('click', ()=>{ 
      if(!s.upload_id) return toast(`[${deviceNo}] 파일을 먼저 선택`, 'warning');
      s.view = (s.view==='processed') ? 'original' : 'processed';
      $btnOriginal.classList.toggle('active', s.view==='original');
      $btnOriginal.textContent = (s.view==='original') ? 'BMP' : '원본';
      refreshPreview();
    });

    // 전송
    function mapRotateForWire(ui){ const n=((ui%360)+360)%360; const is12=(s.uiWidth===1200&&s.uiHeight===1600);
      const table=is12?{0:0,90:90,180:180,270:270}:{0:270,90:0,180:90,270:180}; return table[n]??0; }
    $btnSend.addEventListener('click', async ()=>{
      if(!s.upload_id) return toast(`[${deviceNo}] 전송할 파일이 없습니다.`,'warning');
      const body={ upload_id:s.upload_id, page:s.page||1, device_id:s.device_id, mode:s.mode, scale:s.scale,
        percent:s.percent, rotate:mapRotateForWire(s.rotate), width:s.uiWidth, height:s.uiHeight, layers:s.layers };
      try{ const r=await fetch('/bulletin/sendfile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const js=await r.json(); toast(`[${deviceNo}] 전송 준비 완료 (job #${js.job_id})`,'info'); }
      catch(e){ toast(`[${deviceNo}] 전송 실패`,'danger'); }
    });

    /* ---------- 카드 오버레이(표시용) : 라벨/서명선 표시 ---------- */
    function renderLayersCard(){
      const stage = $overlay.querySelector('.overlay-stage');
      const surface = $overlay.closest('.preview-surface');
      // 현재 카드 해상도(s.uiWidth/s.uiHeight) 기준으로 이미지 뷰포트 계산
      const vp = computeImageViewport(surface, s.uiWidth, s.uiHeight);
      // 스테이지를 실제 이미지 영역에 정확히 맞춤
      stage.style.left = `${vp.left}px`;
      stage.style.top = `${vp.top}px`;
      stage.style.width = `${vp.width}px`;
      stage.style.height = `${vp.height}px`;

      const kx = vp.width / BASE_W;
      const ky = vp.height / BASE_H;

      stage.innerHTML = '';
      s.layers.forEach(L=>{
        if(L.type==='signbox'){
          const el=document.createElement('div');
          el.className='layer-item'; el.dataset.id=L.id;
          el.innerHTML=`<div class="title">결재란</div>`;
          stage.appendChild(el);
          el.style.left  = `${L.parent.x * kx}px`;
          el.style.top   = `${L.parent.y * ky}px`;
          el.style.width = `${L.parent.w * kx}px`;
          el.style.height= `${L.parent.h * ky}px`;

          // 슬롯 + 라벨 + 서명선
          // 슬롯 + 라벨 + 서명선
      const tpl = L.tpl || buildFiveSlotsTemplate();
      const baselineY = tpl.line_pos_ratio ?? 0.72;
      const hpad      = tpl.line_hpad_ratio ?? 0.08;
      // 카드(축소 프리뷰)에서는 얇게 보이도록 1px 고정 또는 약간 스케일
      const thick = 1;
      const wid = L.parent.w * kx, hei = L.parent.h * ky;

      (L.slots||[]).forEach(S=>{
        const d=document.createElement('div');
        d.className='slot-rect';
        const sw = Math.round(S.w_rel*wid), sh = Math.round(S.h_rel*hei);
        d.style.left = `${Math.round(S.x_rel*wid)}px`;
        d.style.top  = `${Math.round(S.y_rel*hei)}px`;
        d.style.width= `${sw}px`;
        d.style.height=`${sh}px`;
        // 테두리 색상(서버 동일) 반영
        d.style.borderColor = tpl.border_color || '#0d6efd';

        // 라벨
        const lab=document.createElement('div');
        lab.className='slot-label';
        lab.textContent = S.label || S.role || '';
        if (tpl.font_color) lab.style.color = tpl.font_color;
        d.appendChild(lab);

        // 서명선
        const line=document.createElement('div');
        line.className='slot-baseline';
        const lineY = Math.round(sh * baselineY);
        const lineLeft = Math.round(sw * hpad);
        const lineRight= Math.round(sw * (1 - hpad));
        line.style.top = `${lineY}px`;
        line.style.left= `${lineLeft}px`;
        line.style.width=`${Math.max(0, lineRight - lineLeft)}px`;
        line.style.height=`${thick}px`;
        if (tpl.line_color) line.style.background = tpl.line_color;
        d.appendChild(line);

        el.appendChild(d);
      });

      }
        // stamp/validity도 stage 기준으로 동일하게 배치
        if(L.type==='stamp' || L.type==='validity'){
          const el=document.createElement('div');
          el.className='layer-item '+(L.type==='stamp'?'layer-stamp':'layer-valid');
          el.dataset.id=L.id;
          el.innerHTML=`<div class="title">${L.type==='stamp'?'직인':'유효기간'}</div><img alt="">`;
          stage.appendChild(el);
          el.style.left  = `${L.x * kx}px`;
          el.style.top   = `${L.y * ky}px`;
          el.style.width = `${L.w * kx}px`;
          el.style.height= `${L.h * ky}px`;
          const img=el.querySelector('img'); if(L.preview_url) img.src=L.preview_url;
        }
      });
    }


    // 초기
    function init(){ refreshPercentRow(); applyPreviewAspect(card,s); }
    init();

    // 외부에서 레이아웃 저장 시 이 카드 포함
    card._state = s;
    card._renderLayers = renderLayersCard;

    // 카드 버튼: 파일 수정(모달 열기)
    $btnEnlarge.addEventListener('click', async ()=>{
      if(!s.upload_id) return toast(`[${deviceNo}] 파일을 먼저 선택하세요.`,'warning');
      modalState = s;
      modalCurrentCard = card;
      modalRotate.value = String(((s.rotate%360)+360)%360);
      await refreshModalPreview();
      renderLayersModal();
      bsModal.show();
    });
  }

  // 모든 카드 바인딩
  document.querySelectorAll('#tiles .card').forEach(bindTile);

  // 전체 전송
  document.getElementById('btn-send-all').addEventListener('click', ()=>{
    document.querySelectorAll('#tiles .card .btn-send').forEach(btn=>btn.click());
  });

  // 레이아웃 저장(모든 카드 상태 취합)
  document.getElementById('btn-save-layouts').addEventListener('click', async ()=>{
    const cards=[...document.querySelectorAll('#tiles .card')];
    const payload = cards.map(c=>({
      device_id: c.dataset.deviceId,
      upload_id: c._state?.upload_id || null,
      layout: { canvas:{w:BASE_W,h:BASE_H}, layers: c._state?.layers || [] }
    }));
    try{
      await fetch('/bulletin/sign_layout/save_batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:payload})});
      toast('레이아웃 저장 완료','success');
    }catch(e){ toast('레이아웃 저장 실패','danger'); }
  });

  // 컨테이너 안에서 실제 이미지가 차지하는 뷰포트(픽셀) 계산
  function computeImageViewport(containerEl, imgTargetW, imgTargetH){
    const r = containerEl.getBoundingClientRect();
    const cw = r.width, ch = r.height;
    const scale = Math.min(cw / imgTargetW, ch / imgTargetH);
    const vw = imgTargetW * scale;
    const vh = imgTargetH * scale;
    const left = (cw - vw) / 2;
    const top  = (ch - vh) / 2;
    return { left, top, width: vw, height: vh, scaleX: vw / imgTargetW, scaleY: vh / imgTargetH };
  }


})();
</script>
