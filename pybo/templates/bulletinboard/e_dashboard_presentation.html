<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-Ink Wall (E01~E05)</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      /* ✅ 사용자 제어: 배경색 */
      --bg: #ffffff;

      /* ✅ 자동 대비(배경색 기준으로 JS가 조정) */
      --fg: #111418;
      --muted: #6c757d;

      /* 액자 느낌 */
      --frame: #f1f3f5;
      --mat: #ffffff;

      --border: #e9ecef;
      --shadow: 0 10px 28px rgba(0,0,0,.06);

      /* 라벨(설명) */
      --label-bg: rgba(255,255,255,.92);
      --label-border: rgba(0,0,0,.10);

      /* 버튼 */
      --btn-bg: rgba(255,255,255,.72);
      --btn-border: rgba(0,0,0,.10);

      /* 1200×1600 = 3:4 */
      --aspect: 0.75; /* width/height */

      /* JS가 채우는 값 (최대화) */
      --tile-w: 320px;
      --tile-h: 426px;

      --gap: 12px;
      --pad: 12px;
      --frame-pad: 10px; /* ‘액자 여백’ 두께 */

      /* 라벨 높이(세로 스택 모드에서 겹침 방지용) */
      --label-h: 66px;
    }

    html, body { height: 100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden; /* 기본: 전시 모드 */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
    }

    /* 상단 바 */
    .topbar{
      height: 56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .title{ display:flex; align-items:baseline; gap:.55rem; white-space: nowrap; }
    .title h1{ font-size: 1.00rem; font-weight: 800; margin: 0; letter-spacing: .15px; }
    .title .sub{ font-size: .80rem; color: var(--muted); }

    .top-actions{ display:flex; align-items:center; gap:8px; }

    .btn-mini{
      padding: .24rem .52rem;
      font-size: .74rem;
      border-radius: 999px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--fg);
      backdrop-filter: blur(8px);
      line-height: 1.1;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }
    .btn-mini:hover{ filter: brightness(1.03); }

    /* ✅ 배경색 컨트롤 */
    .bg-ctrl{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }
    .bg-ctrl .lbl{
      font-size: .74rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .bg-ctrl input[type="color"]{
      width: 28px;
      height: 22px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    /* Wall: 기본은 1줄(5개) / 반응형은 1개씩 세로로 */
    .wall{
      height: calc(100vh - 56px);
      padding: var(--pad);
      display:flex;
      gap: var(--gap);
      align-items:center;
      justify-content:center;
      flex-wrap: nowrap;
    }

    /* ✅ 반응형: 1개씩 크게 + 라벨 겹침 방지 */
    .wall.is-single{
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-padding-top: 18px;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--pad) * 2);
      gap: calc(var(--label-h) + 22px);
    }

    /* 타일은 1200×1600 비율 고정 + JS로 최대화 */
    .tile{
      width: var(--tile-w);
      height: var(--tile-h);
      flex: 0 0 auto;
      scroll-snap-align: start;
      position: relative;
    }

    /* ✅ 액자(외곽) */
    .frame{
      width: 100%;
      height: 100%;
      padding: var(--frame-pad);
      background: var(--frame);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* 실제 1200×1600 콘텐츠가 들어가는 매트 */
    .mat{
      width: 100%;
      height: 100%;
      background: var(--mat);
      border-radius: 14px;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      border: 1px solid rgba(0,0,0,.04);
    }

    .mat img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display:block;
    }

    /* ✅ 라벨: 액자 밖(위쪽), 액자보다 조금 작게 */
    .meta{
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translate(-50%, -100%);

      width: calc(100% - 38px);
      max-width: calc(100% - 38px);
      height: var(--label-h);

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;

      padding: 8px 10px;
      border-radius: 16px;
      background: var(--label-bg);
      border: 1px solid var(--label-border);
      box-shadow: 0 10px 26px rgba(0,0,0,.10);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .meta .left{ min-width: 0; display:flex; align-items:center; gap:10px; }

    .badge-id{
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 1.12rem;
      letter-spacing: .45px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.02);
      color: var(--fg);
    }

    .meta .text{ min-width:0; display:flex; flex-direction:column; line-height: 1.05; }
    .meta .text .cur{
      font-size: .98rem;
      font-weight: 900;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 44ch;
    }
    .meta .text .crc{
      font-size: .82rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .pill{
      font-size: .82rem;
      padding: .42rem .70rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(0,0,0,.02);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    /* 로딩 표시 */
    .state{
      position:absolute;
      top: calc(var(--frame-pad) + 8px);
      left: calc(var(--frame-pad) + 8px);
      padding: .22rem .46rem;
      border-radius: 10px;
      font-size: .74rem;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--muted);
      backdrop-filter: blur(8px);
      display:none;
      z-index: 3;
    }
    .tile.is-loading .state{ display:block; }

    @media (max-width: 1700px){
      body{ overflow: auto; }
      .wall{ justify-content: flex-start; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="title">
      <h1>E-Ink Wall</h1>
      <div class="sub">E01~E05 · 1200×1600 (3:4)</div>
    </div>

    <div class="top-actions">
      <!-- ✅ 배경만 변경 -->
      <div class="bg-ctrl" title="배경색 변경(배경만 선택)">
        <span class="lbl">BG</span>
        <input id="bgColor" type="color" value="#ffffff" />
        <button id="btnBgWhite" class="btn-mini" type="button">White</button>
        <button id="btnBgBlack" class="btn-mini" type="button">Black</button>
        <button id="btnBgReset" class="btn-mini" type="button">Reset</button>
      </div>

      <button id="btnRefresh" class="btn-mini" type="button">새로고침</button>
      <button class="btn-mini" type="button" onclick="history.back()">되돌아가기</button>
    </div>
  </div>

  <div class="wall" id="grid">
    <div class="tile" data-device-id="E01">
      <div class="meta">
        <div class="left">
          <div class="badge-id">E01</div>
          <div class="text">
            <div class="cur">-</div>
            <div class="crc">CRC: -</div>
          </div>
        </div>
        <div class="pill last">Updated: -</div>
      </div>
      <div class="frame">
        <div class="state">loading…</div>
        <div class="mat"><img class="img" src="" alt="preview"></div>
      </div>
    </div>

    <div class="tile" data-device-id="E02">
      <div class="meta">
        <div class="left">
          <div class="badge-id">E02</div>
          <div class="text">
            <div class="cur">-</div>
            <div class="crc">CRC: -</div>
          </div>
        </div>
        <div class="pill last">Updated: -</div>
      </div>
      <div class="frame">
        <div class="state">loading…</div>
        <div class="mat"><img class="img" src="" alt="preview"></div>
      </div>
    </div>

    <div class="tile" data-device-id="E03">
      <div class="meta">
        <div class="left">
          <div class="badge-id">E03</div>
          <div class="text">
            <div class="cur">-</div>
            <div class="crc">CRC: -</div>
          </div>
        </div>
        <div class="pill last">Updated: -</div>
      </div>
      <div class="frame">
        <div class="state">loading…</div>
        <div class="mat"><img class="img" src="" alt="preview"></div>
      </div>
    </div>

    <div class="tile" data-device-id="E04">
      <div class="meta">
        <div class="left">
          <div class="badge-id">E04</div>
          <div class="text">
            <div class="cur">-</div>
            <div class="crc">CRC: -</div>
          </div>
        </div>
        <div class="pill last">Updated: -</div>
      </div>
      <div class="frame">
        <div class="state">loading…</div>
        <div class="mat"><img class="img" src="" alt="preview"></div>
      </div>
    </div>

    <div class="tile" data-device-id="E05">
      <div class="meta">
        <div class="left">
          <div class="badge-id">E05</div>
          <div class="text">
            <div class="cur">-</div>
            <div class="crc">CRC: -</div>
          </div>
        </div>
        <div class="pill last">Updated: -</div>
      </div>
      <div class="frame">
        <div class="state">loading…</div>
        <div class="mat"><img class="img" src="" alt="preview"></div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const grid = document.getElementById("grid");
    const btnRefresh = document.getElementById("btnRefresh");

    // BG controls
    const bgColor = document.getElementById("bgColor");
    const btnBgWhite = document.getElementById("btnBgWhite");
    const btnBgBlack = document.getElementById("btnBgBlack");
    const btnBgReset = document.getElementById("btnBgReset");

    const ASPECT = 0.75; // width/height (1200/1600)
    const GAP = 12;
    const PAD = 12;

    const BG_KEY = "eink_wall_bg";
    const BG_DEFAULT = "#ffffff";

    function hexToRgb(hex){
      const h = (hex || "").replace("#","").trim();
      if(h.length === 3){
        const r = parseInt(h[0]+h[0],16), g = parseInt(h[1]+h[1],16), b = parseInt(h[2]+h[2],16);
        return {r,g,b};
      }
      if(h.length === 6){
        const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
        return {r,g,b};
      }
      return null;
    }

    function luminance({r,g,b}){
      const toLin = (v) => {
        v /= 255;
        return (v <= 0.03928) ? (v/12.92) : Math.pow((v+0.055)/1.055, 2.4);
      };
      const R = toLin(r), G = toLin(g), B = toLin(b);
      return 0.2126*R + 0.7152*G + 0.0722*B;
    }

    function applyBg(hex){
      if(!hex) return;
      document.documentElement.style.setProperty("--bg", hex);
      localStorage.setItem(BG_KEY, hex);
      bgColor.value = hex;

      const rgb = hexToRgb(hex);
      const L = rgb ? luminance(rgb) : 1.0;
      const isDark = (L < 0.35);

      if(isDark){
        document.documentElement.style.setProperty("--fg", "#f2f4f7");
        document.documentElement.style.setProperty("--muted", "#9aa3ad");
        document.documentElement.style.setProperty("--border", "rgba(255,255,255,.12)");
        document.documentElement.style.setProperty("--shadow", "0 12px 34px rgba(0,0,0,.55)");
        document.documentElement.style.setProperty("--btn-bg", "rgba(15,22,32,.72)");
        document.documentElement.style.setProperty("--btn-border", "rgba(255,255,255,.14)");
        document.documentElement.style.setProperty("--label-bg", "rgba(15,22,32,.82)");
        document.documentElement.style.setProperty("--label-border", "rgba(255,255,255,.16)");
        document.documentElement.style.setProperty("--frame", "#0f1620");
        document.documentElement.style.setProperty("--mat", "#0b0f14");
      }else{
        document.documentElement.style.setProperty("--fg", "#111418");
        document.documentElement.style.setProperty("--muted", "#6c757d");
        document.documentElement.style.setProperty("--border", "#e9ecef");
        document.documentElement.style.setProperty("--shadow", "0 10px 28px rgba(0,0,0,.06)");
        document.documentElement.style.setProperty("--btn-bg", "rgba(255,255,255,.72)");
        document.documentElement.style.setProperty("--btn-border", "rgba(0,0,0,.10)");
        document.documentElement.style.setProperty("--label-bg", "rgba(255,255,255,.92)");
        document.documentElement.style.setProperty("--label-border", "rgba(0,0,0,.10)");
        document.documentElement.style.setProperty("--frame", "#f1f3f5");
        document.documentElement.style.setProperty("--mat", "#ffffff");
      }
    }

    function setImg(img, url){
      img.src = url ? (url + (url.includes('?') ? '&' : '?') + 't=' + Date.now()) : '';
    }

    function fmtTime(ts){
      if(!ts) return "-";
      try{
        if(typeof ts === "number"){
          const ms = (ts < 1e12) ? ts * 1000 : ts;
          return new Date(ms).toLocaleString();
        }
        return new Date(ts).toLocaleString();
      }catch(e){
        return String(ts);
      }
    }

    async function api(url){
      const r = await fetch(url, { cache: "no-store" });
      if(!r.ok) throw new Error(url + " -> " + r.status);
      return r.json();
    }

    async function refresh(){
      const tiles = Array.from(grid.querySelectorAll(".tile[data-device-id]"));
      tiles.forEach(t => t.classList.add("is-loading"));

      const data = await api("/dashboard/presentation_board");

      tiles.forEach(tile => {
        const did = tile.dataset.deviceId;
        const cur = data.devices?.[did]?.current || null;

        tile.querySelector(".cur").textContent = cur?.title || "-";
        tile.querySelector(".crc").textContent = "CRC: " + (cur?.crc32 || "-");
        tile.querySelector(".last").textContent = "Updated: " + fmtTime(cur?.updated_at || cur?.updatedAt || cur?.ts);

        setImg(tile.querySelector(".img"), cur?.preview_url);
        tile.classList.remove("is-loading");
      });
    }

    function layoutTiles(){
      const topH = document.querySelector('.topbar')?.getBoundingClientRect().height || 56;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const cols = (vw >= 1700) ? 5 : 1;
      grid.classList.toggle('is-single', cols === 1);

      const usableW = Math.max(320, vw - PAD*2);
      const usableH = Math.max(320, vh - topH - PAD*2);

      const widthPerTile = (usableW - GAP * (cols - 1)) / cols;
      const maxHByW = widthPerTile / ASPECT;
      const tileH = Math.floor(Math.min(usableH, maxHByW));
      const tileW = Math.floor(tileH * ASPECT);

      document.documentElement.style.setProperty('--tile-h', tileH + 'px');
      document.documentElement.style.setProperty('--tile-w', tileW + 'px');
    }

    // 키: b(배경 포커스), r(리프레시)
    window.addEventListener('keydown', (e) => {
      if(e.key === 'b' || e.key === 'B') bgColor.focus();
      if(e.key === 'r' || e.key === 'R') refresh();
    });

    // init bg
    const savedBg = localStorage.getItem(BG_KEY) || BG_DEFAULT;
    applyBg(savedBg);

    bgColor.addEventListener("input", (e) => applyBg(e.target.value));
    btnBgWhite.addEventListener("click", () => applyBg("#ffffff"));
    btnBgBlack.addEventListener("click", () => applyBg("#0b0f14"));
    btnBgReset.addEventListener("click", () => applyBg(BG_DEFAULT));

    btnRefresh.addEventListener("click", refresh);

    window.addEventListener('resize', layoutTiles);
    layoutTiles();
    refresh();

    /* ✅ 30초마다 자동 리로드(페이지 전체 새로고침) */
    setInterval(() => {
      location.reload();
    }, 30000);

  })();
  </script>
</body>
</html>
